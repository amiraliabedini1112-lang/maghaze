<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مدیریت مغازه</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- صفحه ورود -->
    <div id="login">

        <h1>مدیریت مغازه</h1>

        <input
            id="username"
            type="text"
            placeholder="نام کاربری"
        >

        <input
            id="password"
            type="password"
            placeholder="رمز عبور"
        >

        <button onclick="login()">
            ورود
        </button>

        <p id="error"></p>

    </div>


    <!-- برنامه اصلی -->
    <div id="app" style="display: none;">

        <header>

            <h1>مدیریت مغازه</h1>

            <p>
                مدیریت کالا، خرید، فروش و موجودی
            </p>

        </header>


        <!-- منوی اصلی -->
        <nav>

            <button onclick="show('dashboard')">
                داشبورد
            </button>

            <button onclick="show('products')">
                کالاها
            </button>

            <button onclick="show('sales')">
                ثبت فروش
            </button>

            <button onclick="show('purchases')">
                ثبت خرید
            </button>

            <button onclick="show('history')">
                تاریخچه
            </button>

            <button onclick="logout()">
                خروج
            </button>

        </nav>


        <!-- داشبورد -->
        <section id="dashboard">

            <h2>داشبورد</h2>

            <div>
                <strong>تعداد کالاها:</strong>
                <span id="dashboardProducts">0</span>
            </div>

            <div>
                <strong>ارزش موجودی:</strong>
                <span id="dashboardStockValue">0</span>
                تومان
            </div>

            <div>
                <strong>فروش امروز:</strong>
                <span id="dashboardSales">0</span>
                تومان
            </div>

            <h2>
                آخرین معاملات
            </h2>

            <div id="recentTransactions">
                هنوز معامله‌ای ثبت نشده است.
            </div>

        </section>


        <!-- کالاها -->
        <section id="products" style="display: none;">

            <h2>افزودن کالا</h2>

            <input
                id="name"
                type="text"
                placeholder="نام کالا"
            >

            <input
                id="buy"
                type="number"
                placeholder="قیمت خرید"
            >

            <input
                id="sell"
                type="number"
                placeholder="قیمت فروش"
            >

            <input
                id="stock"
                type="number"
                placeholder="موجودی"
            >

            <button onclick="addProduct()">
                ثبت کالا
            </button>


            <h2>
                لیست کالاها
            </h2>

            <div id="productList">
                هنوز کالایی ثبت نشده است.
            </div>

        </section>


        <!-- ثبت فروش -->
        <section id="sales" style="display: none;">

            <h2>ثبت فروش</h2>

            <label>
                کالا
            </label>

            <select id="saleProduct">
                <option value="">
                    انتخاب کالا
                </option>
            </select>


            <label>
                تعداد
            </label>

            <input
                id="saleQty"
                type="number"
                value="1"
                min="1"
            >


            <button onclick="addSale()">
                ثبت فروش
            </button>


            <p id="saleMessage"></p>

        </section>


        <!-- ثبت خرید -->
        <section id="purchases" style="display: none;">

            <h2>ثبت خرید</h2>

            <label>
                کالا
            </label>

            <select id="purchaseProduct">
                <option value="">
                    انتخاب کالا
                </option>
            </select>


            <label>
                تعداد
            </label>

            <input
                id="purchaseQty"
                type="number"
                value="1"
                min="1"
            >


            <button onclick="addPurchase()">
                ثبت خرید
            </button>


            <p id="purchaseMessage"></p>

        </section>


        <!-- تاریخچه -->
        <section id="history" style="display: none;">

            <h2>
                تاریخچه خرید و فروش
            </h2>

            <div id="historyList">
                هنوز معامله‌ای ثبت نشده است.
            </div>

        </section>

    </div>


    <!-- فایل جاوااسکریپت -->
    <script src="app.js"></script>

</body>
</html>
